name: open-model

services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: open-model-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    volumes:
      - ollama-data:/root/.ollama
    networks: [backend]
    expose: ["11434"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEMORY_LIMIT:-20G}
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.10-alpine
    container_name: open-model-caddy
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      MODEL_DOMAIN: ${MODEL_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [backend]
    security_opt:
      - no-new-privileges:true

networks:
  backend:
    driver: bridge

volumes:
  ollama-data:
  caddy-data:
  caddy-config:
