apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
        resources:
          limits:
            memory: 12Gi
            cpu: "8"
          requests:
            memory: 2Gi
            cpu: "2"
        volumeMounts:
        - name: ollama-data
          mountPath: /root/.ollama
        - name: models
          mountPath: /workspace/models
          readOnly: true
        livenessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: ollama-data
        persistentVolumeClaim:
          claimName: ollama-data-pvc
      - name: models
        configMap:
          name: ollama-models-config
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-svc
  namespace: ollama
  labels:
    app: ollama
spec:
  selector:
    app: ollama
  ports:
  - port: 11434
    targetPort: 11434
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-connect
  namespace: ollama
  labels:
    app: open-connect
spec:
  replicas: 2
  selector:
    matchLabels:
      app: open-connect
  template:
    metadata:
      labels:
        app: open-connect
    spec:
      containers:
      - name: open-connect
        image: open-connect:latest
        ports:
        - containerPort: 3000
        env:
        - name: OLLAMA_URL
          value: "http://ollama-svc.ollama.svc.cluster.local:11434"
        - name: PORT
          value: "3000"
        resources:
          limits:
            memory: 2Gi
            cpu: "2"
          requests:
            memory: 512Mi
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: open-connect-svc
  namespace: ollama
  labels:
    app: open-connect
spec:
  selector:
    app: open-connect
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP
---
