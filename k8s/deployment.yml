---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: ollama
  labels:
    app: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
      - name: orchestrator
        image: orchestrator:latest
        ports:
        - containerPort: 8080
        env:
        - name: OLLAMA_URL
          value: "http://ollama-svc.ollama.svc.cluster.local:11434"
        - name: OPEN_CONNECT_URL
          value: "http://open-connect-svc.ollama.svc.cluster.local:3000"
        - name: OPEN_COMMAND_URL
          value: "http://open-command-svc.ollama.svc.cluster.local:5000"
        - name: OPEN_WORKER_URL
          value: "http://open-worker-svc.ollama.svc.cluster.local:6000"
        - name: SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: ollama-secrets
              key: supabase_url
        resources:
          limits:
            memory: 1Gi
            cpu: "1"
          requests:
            memory: 256Mi
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-svc
  namespace: ollama
  labels:
    app: orchestrator
spec:
  selector:
    app: orchestrator
  ports:
  - port: 8080
    targetPort: 8080
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor
  namespace: ollama
  labels:
    app: monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitor
  template:
    metadata:
      labels:
        app: monitor
    spec:
      containers:
      - name: monitor
        image: ollama-monitor:latest
        ports:
        - containerPort: 9090
        env:
        - name: OLLAMA_URL
          value: "http://ollama-svc.ollama.svc.cluster.local:11434"
        - name: SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: ollama-secrets
              key: supabase_url
        resources:
          limits:
            memory: 512Mi
            cpu: "500m"
          requests:
            memory: 128Mi
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: monitor-svc
  namespace: ollama
  labels:
    app: monitor
spec:
  selector:
    app: monitor
  ports:
  - port: 9090
    targetPort: 9090
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-data-pvc
  namespace: ollama
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-models-config
  namespace: ollama
data:
  models.json: |
    - name: llama3
      size: 4.7GB
    - name: codellama
      size: 3.4GB
    - name: mistral
      size: 4.1GB
    - name: phi3
      size: 2.3GB
