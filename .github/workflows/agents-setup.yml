name: Agent Dependencies

on:
  push:
    paths:
      - 'scripts/fixers/requirements.txt'
      - '.github/workflows/agents-setup.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  install-python-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Python dependencies
        run: |
          pip3 install -r scripts/fixers/requirements.txt
          echo "Dependencies installed successfully"
  
  validate-python-scripts:
    runs-on: ubuntu-latest
    needs: install-python-deps
    steps:
      - uses: actions/checkout@v4
      
      - name: Install requirements
        run: pip3 install -r scripts/fixers/requirements.txt
      
      - name: Validate agent_fixer.py
        run: python3 -m py_compile scripts/fixers/agent_fixer.py
      
      - name: Validate self_improvement.py
        run: python3 -m py_compile scripts/fixers/self_improvement.py
      
      - name: Validate autopilot.py
        run: python3 -m py_compile scripts/fixers/autopilot.py
      
      - name: Validate hermes_orchestrator.py
        run: python3 -m py_compile agent/hermes_orchestrator.py
      
      - name: All validations passed
        run: echo "All Python scripts are valid and dependency-ready"
