name: Project Board Automation

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kanban.yml'

permissions:
  contents: read
  issues: write
  pull-requests: write
  projects: write

jobs:
  update-project-board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync infrastructure tasks
        run: |
          echo "Checking infrastructure status..."
          # This would integrate with GitHub Projects API
          # to auto-update board columns based on workflow results

  model_rotation_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check model staleness
        run: |
          python3 scripts/fixers/agent_fixer.py diag
        continue-on-error: true

  rotate_models:
    runs-on: ubuntu-latest
    needs: model_rotation_check
    if: success()
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CONTABO_SSH_PRIVATE_KEY }}

      - name: Rotate models
        run: |
          ssh -o StrictHostKeyChecking=no             root@169.58.68.183 "bash /opt/ollama/scripts/contabo/install_models.sh"

  create_rotation_pr:
    runs-on: ubuntu-latest
    needs: rotate_models
    steps:
      - uses: actions/checkout@v4

      - name: Generate rotation report
        run: |
          cat << 'EOF' > /tmp/rotation-report.md
          # Model Rotation Report

          **Date:** $(date -I)
          **Action:** Automated model rotation check

          ## Models Synced
          - Gemma 4 (latest)
          - Llama 3.2 (3b, 1b)
          - Qwen 2.5 (7b, 1.5b)
          - Mistral (7b)

          ## Next Rotation
          - Scheduled: $(date -d '+30 days' +%Y-%m-%d)
          EOF
          echo "Rotation report generated"

  incident_automation:
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Create incident issue
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Auto-Incident: ${{ github.job }} failed"
          content: |
            ## Automated Incident

            **Workflow:** ${{ github.workflow }}
            **Job:** ${{ github.job }}
            **Time:** ${{ github.event.head_commit.timestamp }}
            **Server:** 169.58.68.183

            ### Auto-Remediation
            - Health check failed
            - Self-heal attempted
            - Escalation required if unresolved

          labels: incident, auto, critical
          assignees: ${{ github.actor }}
