name: "CI/CD Pipeline - Enterprise Ollama"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}
  CONTABO_IP: 169.58.68.183
  SUPABASE_URL: https://olhtxibbyhucxcmhzblq.supabase.co

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate all YAML files
        run: |
          for file in $(find . -name "*.yml" -o -name "*.yaml" | grep -v node_modules); do
            echo "Validating $file..."
            python3 -c "import yaml; yaml.safe_load(open('$file'))" || exit 1
          done

      - name: Validate Python files
        run: |
          for file in $(find . -name "*.py" | grep -v __pycache__); do
            echo "Syntax checking $file..."
            python3 -m py_compile "$file" || exit 1
          done

      - name: Validate Shell scripts
        run: |
          for file in $(find scripts -name "*.sh" | grep -v __pycache__); do
            echo "Checking $file for syntax errors..."
            bash -n "$file" || exit 1
          done

      - name: Validate JSON files
        run: |
          for file in $(find . -name "*.json" | grep -v node_modules | grep -v package-lock); do
            echo "Validating $file..."
            python3 -c "import json; json.load(open('$file'))" || exit 1
          done

      - name: Run infrastructure tests
        run: |
          chmod +x scripts/test_infrastructure.sh
          bash scripts/test_infrastructure.sh

  build-images:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: ollama
            context: .
            dockerfile: Dockerfile
          - name: open-connect
            context: .
            dockerfile: platform/open-connect/Dockerfile
          - name: open-command
            context: .
            dockerfile: platform/open-command/Dockerfile
          - name: open-worker
            context: .
            dockerfile: platform/open-worker/Dockerfile
          - name: orchestrator
            context: .
            dockerfile: platform/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-contabo:
    needs: [validate, build-images]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Execute deployment script
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.CONTABO_IP }}
          username: ollama
          key: ${{ secrets.CONTABO_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/ollama
            git pull origin main
            chmod +x scripts/autonomous_setup.sh
            bash scripts/autonomous_setup.sh --deploy-only

      - name: Run post-deploy verification
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.CONTABO_IP }}
          username: ollama
          key: ${{ secrets.CONTABO_SSH_PRIVATE_KEY }}
          script: |
            bash /opt/ollama/scripts/contabo/verify_deployment.sh

  run-health-checks:
    needs: deploy-contabo
    runs-on: ubuntu-latest
    steps:
      - name: Run production readiness check
        run: |
          chmod +x scripts/contabo/production_readiness_check.sh
          bash scripts/contabo/production_readiness_check.sh

  sync-supabase:
    needs: deploy-contabo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync models to Supabase
        run: |
          python3 scripts/fixers/sync_supabase.py
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

  cleanup:
    needs: [deploy-contabo, run-health-checks, sync-supabase]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Remove old container images
        run: |
          docker image prune -f
          docker buildx prune -f

  report:
    needs: [validate, build-images, deploy-contabo, run-health-checks, sync-supabase]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Generate deployment report
        run: |
          echo "## Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Validation | Complete |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Build | Complete |" >> $GITHUB_STEP_SUMMARY
          echo "| Contabo Deploy | Complete |" >> $GITHUB_STEP_SUMMARY
          echo "| Health Checks | Complete |" >> $GITHUB_STEP_SUMMARY
          echo "| Supabase Sync | Complete |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
