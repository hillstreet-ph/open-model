name: Deploy to Contabo

on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'CMakeLists.txt'
      - 'Dockerfile'
      - 'cmake/**'
      - 'llama/**'
      - 'scripts/contabo/**'
      - 'platform/**'
      - 'k8s/**'
      - 'scripts/supabase/**'
      - '.github/workflows/**'

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'

      - name: Build Ollama binary
        run: |
          go build -o ollama .
          ls -la ollama

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ollama-binary
          path: ollama

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: contabo-production
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ollama-binary

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CONTABO_SSH_PRIVATE_KEY }}

      - name: Deploy to Contabo
        run: |
          chmod +x ollama
          scp -o StrictHostKeyChecking=no \
            -i ~/.ssh/id_ed25519 \
            ollama root@169.58.68.183:/opt/ollama/ollama

      - name: Restart Ollama service
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/id_ed25519 \
            root@169.58.68.183 "systemctl restart ollama"

      - name: Verify deployment
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/id_ed25519 \
            root@169.58.68.183 "systemctl is-active ollama"

  self-heal:
    needs: deploy
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Health check
        run: |
          for i in 1 2 3; do
            if curl -sf http://169.58.68.183:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama is healthy after deploy"
              exit 0
            fi
            echo "Health check attempt $i failed, retrying..."
            sleep 10
          done
          echo "Health check failed, triggering remediation..."
          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/id_ed25519 \
            root@169.58.68.183 "systemctl restart ollama && systemctl reset-failed ollama"
        continue-on-error: true

  infra-sync:
    needs: deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CONTABO_SSH_PRIVATE_KEY }}

      - name: Sync platform code to Contabo
        run: |
          scp -o StrictHostKeyChecking=no \
            -i ~/.ssh/id_ed25519 \
            -r \
            scripts/contabo/ \
            platform/ \
            k8s/ \
            scripts/supabase/ \
            root@169.58.68.183:/opt/ollama/

      - name: Deploy platform infrastructure on Contabo
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/id_ed25519 \
            root@169.58.68.183 \
            "cd /opt/ollama && bash scripts/contabo/server_platform.sh"

      - name: Run production readiness check
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/id_ed25519 \
            root@169.58.68.183 \
            "cd /opt/ollama && bash scripts/contabo/production_readiness_check.sh" || true

  supabase-sync:
    needs: [deploy, infra-sync]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Supabase
        run: |
          chmod +x scripts/supabase/deploy.sh
          bash scripts/supabase/deploy.sh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}