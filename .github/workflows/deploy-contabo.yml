name: Deploy Contabo

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Git revision to deploy
        required: false
        default: main
  push:
    branches: [main]
    paths:
      - deploy/**
      - .github/workflows/deploy-contabo.yml

concurrency:
  group: contabo-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose --env-file deploy/.env.example -f deploy/compose.yaml config --quiet
      - name: Check shell scripts
        run: |
          bash -n deploy/scripts/bootstrap-ubuntu.sh
          bash -n deploy/scripts/deploy.sh

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          REVISION: ${{ github.event.inputs.revision || github.sha }}
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_PRIVATE_KEY }}
          port: ${{ secrets.CONTABO_SSH_PORT }}
          envs: REVISION
          command_timeout: 25m
          script_stop: true
          script: |
            export REVISION
            /opt/open-model/current/deploy/scripts/deploy.sh
