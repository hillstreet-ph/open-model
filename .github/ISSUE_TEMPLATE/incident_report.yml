name: Incident Report
description: Report an incident detected by the self-healing system
title: '[INCIDENT] '
labels: ['incident', 'self-heal', 'critical']
body:
  - type: markdown
    attributes:
      value: |
        ## Incident Report (Auto-Generated)
  - type: textarea
    id: details
    attributes:
      label: Incident Details
      description: What happened (will be auto-filled by self-heal agent)
      placeholder: "Auto-generated by hermes-fix agent"
    validations:
      required: false
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Severity 1: Critical (service down)
        - Severity 2: High (degraded)
        - Severity 3: Medium (intermittent)
        - Severity 4: Low (informational)
  - type: textarea
    id: resolution
    attributes:
      label: Resolution
      placeholder: "How was this resolved?"
